[project]
name = "ffmpeg-api"
version = "1.2.0"
description = "Standalone Splat-I FFmpeg API module."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "mcp>=1.27.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools]
py-modules = ["ffmpeg_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
